syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.example.userserviceproto";
option java_outer_classname = "UserServiceProto";

service UserService {
  rpc GetFollowerEmails(GetFollowerEmailsRequest) returns (GetFollowerEmailsResponse);
}

message GetFollowerEmailsRequest {
  string user_id = 1;
}

message GetFollowerEmailsResponse {
  repeated string emails = 1;
}