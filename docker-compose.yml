services:

  # ─── Infrastructure ────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ahsan.130104
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Service Discovery ─────────────────────────────────────────────

  eureka:
    build:
      context: ./eureka
    container_name: eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ─── Config Server ─────────────────────────────────────────────────

  cloudconfigservice:
    build:
      context: ./cloudconfigservice
    container_name: cloudconfigservice
    ports:
      - "8888:8888"
    environment:
      - SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD=${GITHUB_PAT}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ─── AI Service (HTTP: 8083, gRPC: 9090) ───────────────────────────

  aiservice:
    build:
      context: ./aiservice
    container_name: aiservice
    ports:
      - "8083:8083"
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudconfigservice:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=http://host.docker.internal:4318/v1/logs
    depends_on:
      cloudconfigservice:
        condition: service_healthy

  # ─── User Service (HTTP: 8081, gRPC: 9091) ─────────────────────────

  userservice:
    build:
      context: ./userservice
    container_name: userservice
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudconfigservice:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/user_service_db_blogging_app
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - GRPC_SERVER_HOST=userservice
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=http://host.docker.internal:4318/v1/logs
    depends_on:
      postgres:
        condition: service_healthy
      cloudconfigservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Auth Service ──────────────────────────────────────────────────

  authservice:
    build:
      context: ./authservice
    container_name: authservice
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudconfigservice:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=http://host.docker.internal:4318/v1/logs
    depends_on:
      cloudconfigservice:
        condition: service_healthy

  # ─── Post Service ──────────────────────────────────────────────────

  postservice:
    build:
      context: ./postservice
    container_name: postservice
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudconfigservice:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/post_service_db_blogging_app
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - AI_SERVICE_GRPC_HOST=aiservice
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=http://host.docker.internal:4318/v1/logs
    depends_on:
      postgres:
        condition: service_healthy
      cloudconfigservice:
        condition: service_healthy
      aiservice:
        condition: service_started

  # ─── Feed Service ──────────────────────────────────────────────────

  feedservice:
    build:
      context: ./feedservice
    container_name: feedservice
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudconfigservice:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/feed_service_db_blogging_app
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - USER_SERVICE_GRPC_HOST=userservice
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=http://host.docker.internal:4318/v1/logs
    depends_on:
      postgres:
        condition: service_healthy
      cloudconfigservice:
        condition: service_healthy
      userservice:
        condition: service_healthy

  # ─── Notification Service ──────────────────────────────────────────

  notificationservice:
    build:
      context: ./notificationservice
    container_name: notificationservice
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudconfigservice:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - USER_SERVICE_GRPC_HOST=userservice
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=http://host.docker.internal:4318/v1/logs
    depends_on:
      cloudconfigservice:
        condition: service_healthy
      userservice:
        condition: service_healthy

  # ─── Search Service ────────────────────────────────────────────────

  searchservice:
    build:
      context: ./searchservice
    container_name: searchservice
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudconfigservice:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=http://host.docker.internal:4318/v1/logs
    depends_on:
      elasticsearch:
        condition: service_healthy
      cloudconfigservice:
        condition: service_healthy

  # ─── API Gateway ───────────────────────────────────────────────────

  apigateway:
    build:
      context: ./apigateway
    container_name: apigateway
    ports:
      - "1111:1111"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_IMPORT=optional:configserver:http://cloudconfigservice:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_SERVICE_URL=http://aiservice:8083
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://host.docker.internal:4318/v1/traces
      - MANAGEMENT_OTLP_LOGGING_ENDPOINT=http://host.docker.internal:4318/v1/logs
    depends_on:
      eureka:
        condition: service_healthy
      cloudconfigservice:
        condition: service_healthy

volumes:
  postgres_data:
  elasticsearch_data:
